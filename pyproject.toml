[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datarules"
version = "0.1.0"
description = "Data Upload & Normalization Hub for document ingestion, extraction, indexing, and RAG access."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "openpyxl>=3.1.5",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "pillow>=10.4.0",
  "pandas>=2.2.2",
  "psycopg[binary]>=3.2.0",
  "huggingface-hub>=0.26.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
model = [
  "vllm",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
